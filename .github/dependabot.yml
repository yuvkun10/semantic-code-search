version: 2
updates:
- package-ecosystem: npm
  schedule:
    interval: monthly
    time: '10:20'
    timezone: Australia/Melbourne
  directory: "/"
  groups:
    npm-production-minor-patch:
      applies-to: version-updates
      dependency-type: production
      patterns:
      - "*"
      update-types:
      - minor
      - patch
    npm-development-minor-patch:
      applies-to: version-updates
      dependency-type: development
      patterns:
      - "*"
      update-types:
      - minor
      - patch
    npm-security:
      applies-to: security-updates
      patterns:
      - "*"
- package-ecosystem: github-actions
  schedule:
    interval: monthly
    time: '10:30'
    timezone: Australia/Melbourne
  directory: "/"
  groups:
    actions-minor-patch:
      applies-to: version-updates
      patterns:
      - "*"
      update-types:
      - minor
      - patch
    actions-major:
      applies-to: version-updates
      patterns:
      - "*"
      update-types:
      - major
    actions-security:
      applies-to: security-updates
      patterns:
      - "*"
