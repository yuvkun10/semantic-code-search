name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run deps:audit
      - run: npm run deps:outdated
        continue-on-error: true  # informational: newer releases should not fail CI
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
